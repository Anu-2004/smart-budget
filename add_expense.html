<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="page-container">

    <div class="expense-list-box">

        <!-- Icon -->

        <div class="top-icon">

            <i class="fa-solid fa-money-bill-wave"></i>

        </div>


        <!-- Heading -->

        <h2>Add Expense</h2>

        <p class="selected-period">

            {{ period|capitalize }} Expense

        </p>


        <!-- Expense Form -->

        <form action="{{ url_for('save_expense') }}"
              method="POST">


            <!-- Hidden Period -->

            <input type="hidden"
                   name="period"
                   value="{{ period }}">


            <!-- Item -->

            <div class="mb-3">

                <label class="form-label">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Expense Item
                </label>

                <input type="text"
                       name="item"
                       class="form-control"
                       placeholder="Example: Food"
                       required>

            </div>


            <!-- Amount -->

            <div class="mb-3">

                <label class="form-label">

                    <i class="fa-solid fa-indian-rupee-sign"></i>

                    Amount

                </label>

                <input type="number"
                       name="amount"
                       class="form-control"
                       placeholder="Enter amount"
                       min="1"
                       step="0.01"
                       required>

            </div>


            <!-- Category -->

            <div class="mb-4">

                <label class="form-label">

                    <i class="fa-solid fa-list"></i>

                    Category

                </label>

                <select name="category"
                        class="form-select"
                        required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Medical">
                        Medical
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Add Button -->

            <button type="submit"
                    class="btn btn-primary w-100 login-btn">

                <i class="fa-solid fa-plus me-2"></i>

                Add Expense

            </button>

        </form>


        <!-- Back -->

        <div class="create-account">

            <a href="{{ url_for('expense_list') }}">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Expense List

            </a>

        </div>

    </div>

</div>

</body>

</html>
